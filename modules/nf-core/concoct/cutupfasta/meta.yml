name: "concoct_cutupfasta"
description: Cut up fasta file in non-overlapping or overlapping parts of equal
  length.
keywords:
  - contigs
  - fragment
  - mags
  - binning
  - fasta
  - cut
  - cut up
tools:
  - "concoct":
      description: "Clustering cONtigs with COverage and ComposiTion"
      homepage: "https://concoct.readthedocs.io/en/latest/index.html"
      documentation: "https://concoct.readthedocs.io/en/latest/index.html"
      tool_dev_url: "https://github.com/BinPro/CONCOCT"
      doi: "10.1038/nmeth.3103"
      licence:
        - "FreeBSD"
      identifier: biotools:concoct
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: Plain or gzip-compressed FASTA containing contigs; compressed inputs are decoded in the task
        pattern: "*.{fasta,fna,fa,fas,fasta.gz,fna.gz,fa.gz,fas.gz,fasta.GZ,fna.GZ,fa.GZ,fas.GZ}"
        ontologies: []
  - bed:
      type: boolean
      description: Specify whether to generate a BED file describing where each
        contig was cut up
  - autoplasm_helper_0:
      type: file
      description: Local checked adapter bin/run_concoct_cut_checked.py; staged as run_concoct_cut_checked.py. Explicit file content participates in deep task caching.
      pattern: "*.py"
output:
  fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fasta":
          type: file
          description: Cut up fasta file in non-overlapping or overlapping parts
            of equal length.
          pattern: "*.fasta"
          ontologies: []
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bed":
          type: file
          description: Optional BED File containing locations on original contigs
            where they were cut up.
          pattern: "*.bed"
          ontologies: []
  versions_concoct:
    - - ${task.process}:
          type: string
          description: The name of the process
      - concoct:
          type: string
          description: The name of the tool
      - concoct --version | cut -d " " -f2:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - concoct:
          type: string
          description: The name of the tool
      - concoct --version | cut -d " " -f2:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@jfy133"
maintainers:
  - "@jfy133"
