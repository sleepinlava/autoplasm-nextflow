name: spades
description: Assembles a small genome (bacterial, fungal, viral)
keywords:
  - genome
  - assembly
  - genome assembler
  - small genome
  - de novo assembler
tools:
  - spades:
      description: SPAdes (St. Petersburg genome assembler) is intended for both standard
        isolates and single-cell MDA bacteria assemblies.
      homepage: http://cab.spbu.ru/files/release3.15.0/manual.html
      documentation: http://cab.spbu.ru/files/release3.15.0/manual.html
      tool_dev_url: https://github.com/ablab/spades
      doi: 10.1089/cmb.2012.0021
      licence: ["GPL v2"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - illumina:
        type: file
        description: |
          List of input FastQ (Illumina or PacBio CCS reads) files
          of size 1 and 2 for single-end and paired-end data,
          respectively. This input data type is required.
        ontologies: []
    - pacbio:
        type: file
        description: |
          List of input PacBio CLR FastQ files of size 1.
        ontologies: []
    - nanopore:
        type: file
        description: |
          List of input FastQ files of size 1, originating from Oxford Nanopore technology.
        ontologies: []
  - yml:
      type: file
      description: |
        Path to yml file containing read information.
        The raw FASTQ files listed in this YAML file MUST be supplied to the respective illumina/pacbio/nanopore input channel(s) _in addition_ to this YML.
        File entries in this yml must contain only the file name and no paths.
      pattern: "*.{yml,yaml}"
      ontologies:
        - edam: http://edamontology.org/format_3750 # YAML
  - hmm:
      type: file
      description: File or directory with amino acid HMMs for Spades HMM-guided mode.
      ontologies: []
  - autoplasm_helper_0:
      type: file
      description: Local checked adapter bin/spades_graph_provenance.py; staged as .spades_graph_provenance.py. Explicit file content participates in deep task caching.
      pattern: "*.py"
output:
  scaffolds:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
      - "*.scaffolds.fa.gz":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
  contigs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
      - "*.contigs.fa.gz":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
  transcripts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
      - "*.transcripts.fa.gz":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
  gene_clusters:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
      - "*.gene_clusters.fa.gz":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
  gfa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
      - "*.assembly.gfa.gz":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.gfa.gz"
  warnings:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
      - "*.warnings.log":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.fa.gz"
      - "*.spades.log":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.spades.log"
  versions_spades:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - spades:
          type: string
          description: The tool name
      - "spades.py --version 2>&1 | sed -n 's/^.*SPAdes genome assembler v//p'":
          type: eval
          description: The expression to obtain the version of the tool
  fastg:
    - - meta:
          type: map
          description: Original sample metadata
      - "*.assembly_graph.fastg":
          type: file
          description: Same successful SPAdes task final FASTG graph
          pattern: "*.assembly_graph.fastg"

  recycler_graph:
    - - meta:
          type: map
          description: Original sample metadata
      - "*.assembly_graph.fastg":
          type: file
          description: Final graph exported from the same successful task
          pattern: "*.assembly_graph.fastg"
      - "*.graph_provenance.json":
          type: file
          description: Final-copy source, actual k and graph digest validated against execution plan
          pattern: "*.graph_provenance.json"

  gplas_graph:
    - - meta:
          type: map
          description: Original sample metadata
      - "*.gplas.gfa":
          type: file
          description: Same-task assembly_graph_after_simplification.gfa used for independent graph-node classification
          pattern: "*.gplas.gfa"

  plasmaag_assembly:
    - - meta:
          type: map
          description: Original sample metadata
      - "*.plasmaag_spades":
          type: directory
          description: Complete same-task contigs.fasta, contigs.paths and assembly_graph_after_simplification.gfa; emitted when requested
          pattern: "*.plasmaag_spades"


topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - spades:
          type: string
          description: The name of the tool
      - "spades.py --version 2>&1 | sed -n 's/^.*SPAdes genome assembler v//p'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@JoseEspinosa"
  - "@drpatelh"
  - "@d4straub"
maintainers:
  - "@JoseEspinosa"
  - "@drpatelh"
  - "@d4straub"
