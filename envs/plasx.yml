name: autoplasm-plasx
channels:
  - conda-forge
  - bioconda
dependencies:
  # PlasX source is a separate, verified workflow input. There is no plasx0.2
  # Bioconda release. Production uses the exact plasx-linux-64.lock archives.
  - python=3.8.19
  - numpy=1.19.5
  - pandas=1.2.5
  - scipy=1.7.3
  - scikit-learn=0.24.2
  - numba=0.53.1
  - python-blosc=1.10.6
  - mmseqs2=10.6d92c
